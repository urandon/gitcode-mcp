name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check product documentation contracts
        run: ./scripts/check-product-docs.sh

      - name: Check embedded admin UI assets
        run: ./scripts/check-admin-ui-assets.sh

      - name: Check admin UI types and unit tests
        working-directory: web
        run: |
          npm run check
          npm run test

      - name: Install admin UI browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run admin UI browser tests
        working-directory: web
        # CI asserts semantic DOM/ARIA, JSON API, action, and state-machine
        # contracts. Raster baselines and diagnostic capture are local-only.
        run: npm run test:e2e

      - name: Enforce semantic-only browser artifacts
        # A future implicit failure capture or trace/video setting must fail CI.
        if: ${{ always() }}
        run: ./scripts/check-browser-ci-artifacts.sh

      - name: Run tests
        run: go test ./...

      - name: Qualify native user-systemd observation upgrade
        # ubuntu-latest is an ephemeral VM, not a container. Do not install or
        # enable the canonical service. The test runtime-links a unique fixture
        # unit and proves its cleanup; a missing bus fails this explicit gate.
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          if [ ! -S "$XDG_RUNTIME_DIR/bus" ]; then
            sudo systemctl start "user@$(id -u).service" >/dev/null 2>&1
          fi
          for attempt in $(seq 1 20); do
            [ -S "$XDG_RUNTIME_DIR/bus" ] && break
            sleep 0.25
          done
          test -S "$XDG_RUNTIME_DIR/bus"
          go build -o "$RUNNER_TEMP/native-observation-daemon" ./cmd/gitcode-mcp
          GITCODE_MCP_NATIVE_FIXTURE_BINARY="$RUNNER_TEMP/native-observation-daemon" GITCODE_MCP_NATIVE_SYSTEMD_ISOLATED=1 GITCODE_MCP_NATIVE_OBSERVATION_UPGRADE=1 go test ./internal/servicectl -run '^TestNativeObservationUpgradeRecovery$' -count=1 -timeout=180s

      - name: Run release automation tests
        run: python3 -B -m unittest discover -s scripts/release -p 'test_*.py'

      - name: Check diff whitespace
        run: git diff --check
