name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check embedded admin UI assets
        run: ./scripts/check-admin-ui-assets.sh

      - name: Check admin UI types and unit tests
        working-directory: web
        run: |
          npm run check
          npm run test

      - name: Install admin UI browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run admin UI browser tests
        working-directory: web
        env:
          # Sentinels prove CI ignores every local visual-QA input. Browser
          # gates assert semantic DOM/ARIA/API/state contracts only.
          ADMIN_QA_OUTPUT: ${{ runner.temp }}/forbidden-admin-qa
          ADMIN_VIEW_QA_OUTPUT: ${{ runner.temp }}/forbidden-operator-qa
          ADMIN_QA_REFERENCE: ${{ runner.temp }}/missing-reference.png
          ADMIN_VISUAL_BASELINES: "1"
        run: |
          npm run test:e2e
          test ! -e "$ADMIN_QA_OUTPUT"
          test ! -e "$ADMIN_VIEW_QA_OUTPUT"

      - name: Run tests
        run: go test ./...

      - name: Run release automation tests
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py'

      - name: Check diff whitespace
        run: git diff --check
